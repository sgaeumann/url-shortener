[project]
name = "url-shortener"
version = "0.1.0"
description = "A simple URL shortener."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.156.1",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
